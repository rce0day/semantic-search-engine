<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Vector Search</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">
    <div class="container mx-auto px-4 py-8">
        <header class="mb-8">
            <h1 class="text-3xl font-bold text-center text-indigo-700">Semantic Product Search</h1>
            <p class="text-center text-gray-600 mt-2">Search products using natural language</p>
            <div class="text-center mt-2">
                <a href="/admin.html" class="text-sm text-indigo-600 hover:underline">Admin Dashboard →</a>
            </div>
        </header>

        <div class="max-w-2xl mx-auto">
            <div class="bg-white rounded-lg shadow-md p-6 mb-6">
                <form id="search-form" class="flex gap-2">
                    <input type="text" id="search-input" 
                           class="flex-1 px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500" 
                           placeholder="What are you looking for?">
                    <button type="submit" 
                            class="bg-indigo-600 text-white px-4 py-2 rounded-lg hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2">
                        Search
                    </button>
                </form>
            </div>

            <div id="loading-indicator" class="hidden">
                <div class="flex justify-center items-center py-10">
                    <div class="animate-spin rounded-full h-10 w-10 border-t-2 border-b-2 border-indigo-500"></div>
                </div>
            </div>

            <div id="results-container" class="hidden">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-xl font-semibold">Results</h2>
                    <span id="search-stats" class="text-sm text-gray-500"></span>
                </div>
                <div id="results-list" class="space-y-4"></div>
            </div>

            <div id="no-results" class="hidden py-10">
                <p class="text-center text-gray-500">No results found. Try a different search query.</p>
            </div>
        </div>
    </div>

    <template id="result-template">
        <div class="bg-white rounded-lg shadow-md overflow-hidden">
            <div class="p-4">
                <div class="flex items-start gap-4">
                    <div class="w-20 h-20 flex-shrink-0 bg-gray-200 rounded overflow-hidden">
                        <img class="result-image w-full h-full object-cover" src="" alt="Product image">
                    </div>
                    <div class="flex-1 min-w-0">
                        <h3 class="result-title text-lg font-medium text-gray-900 truncate"></h3>
                        <p class="result-price text-indigo-600 font-medium mt-1"></p>
                        <p class="result-score text-sm text-gray-500 mt-1"></p>
                    </div>
                </div>
                <div class="mt-3">
                    <ul class="result-about space-y-1 text-sm text-gray-600"></ul>
                </div>
                <div class="mt-3">
                    <a class="result-link inline-flex items-center text-sm font-medium text-indigo-600 hover:text-indigo-500" href="#" target="_blank">
                        View on Amazon
                        <svg class="ml-1 h-4 w-4" fill="currentColor" viewBox="0 0 20 20">
                            <path d="M11 3a1 1 0 100 2h2.586l-6.293 6.293a1 1 0 101.414 1.414L15 6.414V9a1 1 0 102 0V4a1 1 0 00-1-1h-5z"></path>
                            <path d="M5 5a2 2 0 00-2 2v8a2 2 0 002 2h8a2 2 0 002-2v-3a1 1 0 10-2 0v3H5V7h3a1 1 0 000-2H5z"></path>
                        </svg>
                    </a>
                </div>
            </div>
        </div>
    </template>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const searchForm = document.getElementById('search-form');
            const searchInput = document.getElementById('search-input');
            const loadingIndicator = document.getElementById('loading-indicator');
            const resultsContainer = document.getElementById('results-container');
            const resultsList = document.getElementById('results-list');
            const searchStats = document.getElementById('search-stats');
            const noResults = document.getElementById('no-results');
            const resultTemplate = document.getElementById('result-template');

            searchForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const query = searchInput.value.trim();
                
                if (!query) return;

                resultsList.innerHTML = '';

                loadingIndicator.classList.remove('hidden');
                resultsContainer.classList.add('hidden');
                noResults.classList.add('hidden');
                
                try {
                    const response = await fetch(`/search?query=${encodeURIComponent(query)}`);
                    const data = await response.json();

                    searchStats.textContent = `${data.total} results (${data.search_time_ms.toFixed(2)}ms)`;
                    
                    if (data.results.length === 0) {
                        noResults.classList.remove('hidden');
                    } else {
                        data.results.forEach(result => {
                            const item = result.item;
                            const score = result.score;
                            
                            const resultElement = document.importNode(resultTemplate.content, true);

                            resultElement.querySelector('.result-title').textContent = item.title;

                            resultElement.querySelector('.result-price').textContent = item.price || 'Price not available';
 
                            resultElement.querySelector('.result-score').textContent = `Relevance: ${(score * 100).toFixed(1)}%`;

                            const imageElement = resultElement.querySelector('.result-image');
                            if (item.images && item.images.length > 0) {
                                imageElement.src = item.images[0];
                                imageElement.alt = item.title;
                            } else {
                                imageElement.src = 'https://via.placeholder.com/150';
                                imageElement.alt = 'No image available';
                            }

                            const aboutList = resultElement.querySelector('.result-about');
                            if (item.about_this_item && item.about_this_item.length > 0) {
                                item.about_this_item.slice(0, 2).forEach(about => {
                                    const li = document.createElement('li');
                                    li.textContent = about;
                                    li.className = 'truncate';
                                    aboutList.appendChild(li);
                                });
                            }
                            
                            const linkElement = resultElement.querySelector('.result-link');
                            if (item.link) {
                                linkElement.href = item.link;
                            } else {
                                linkElement.remove();
                            }
                            
                            resultsList.appendChild(resultElement);
                        });
                        
                        resultsContainer.classList.remove('hidden');
                    }
                } catch (error) {
                    console.error('Error fetching results:', error);
                    noResults.textContent = 'An error occurred. Please try again.';
                    noResults.classList.remove('hidden');
                } finally {
                    loadingIndicator.classList.add('hidden');
                }
            });
        });
    </script>
</body>
</html>
